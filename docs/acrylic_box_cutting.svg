<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="252mm"
     height="184mm"
     viewBox="0 0 252 184"
     version="1.1">
  <defs>
    <style>
      .cut-line { stroke: #ff0000; stroke-width: 0.1; fill: none; }
    </style>
  </defs>

  <!-- =================================================================== -->
  <!-- BARIS 1: TUTUP ATAS & ALAS BAWAH (Spasi aman 4 mm, Hemat Bahan)     -->
  <!-- =================================================================== -->

  <!-- 1. PANEL TUTUP ATAS (120 x 80 mm) di X=4, Y=4 -->
  <g id="PANEL_TUTUP_ATAS">
    <!-- Kontur Luar Panel Tutup Atas (Siku 90 Derajat Rata) -->
    <rect x="4" y="4" width="120" height="80" class="cut-line" />
    
    <!-- Cut-out Jendela Layar OLED (31 mm x 26 mm) -->
    <rect x="66" y="31" width="31" height="26" rx="1" class="cut-line" />
    
    <!-- Lubang Push Button (Diameter 6.5 mm) -->
    <circle cx="107" cy="44" r="3.25" class="cut-line" />
  </g>

  <!-- 2. PANEL ALAS BAWAH (120 x 80 mm) di X=128, Y=4 -->
  <g id="PANEL_ALAS_BAWAH">
    <!-- Kontur Luar Panel Alas Bawah (Polos Rata Siku 90 Derajat) -->
    <rect x="128" y="4" width="120" height="80" class="cut-line" />
  </g>

  <!-- =================================================================== -->
  <!-- BARIS 2: DINDING DEPAN & DINDING BELAKANG (Spasi aman 4 mm)         -->
  <!-- =================================================================== -->

  <!-- 3. PANEL DINDING DEPAN (120 x 44 mm) di X=4, Y=88 (Polos Bersih)    -->
  <g id="PANEL_DINDING_DEPAN">
    <rect x="4" y="88" width="120" height="44" class="cut-line" />
  </g>

  <!-- 4. PANEL DINDING BELAKANG (120 x 44 mm) di X=128, Y=88               -->
  <!-- 1 U-Slot Bersama untuk Kabel Sensor (Lebar 14 mm x Kedalaman 8 mm)   -->
  <g id="PANEL_DINDING_BELAKANG">
    <path d="M 128 88
             L 213 88
             L 213 94
             A 2 2 0 0 0 215 96
             L 225 96
             A 2 2 0 0 0 227 94
             L 227 88
             L 248 88
             L 248 132
             L 128 132
             Z" class="cut-line" />
  </g>

  <!-- =================================================================== -->
  <!-- BARIS 3: DINDING KIRI & DINDING KANAN (Spasi aman 4 mm)             -->
  <!-- =================================================================== -->

  <!-- 5. PANEL DINDING KIRI (74 x 44 mm) di X=4, Y=136                    -->
  <!-- Port USB Type-C ESP32 (Lebar 14 mm x Tinggi 9 mm, R=2 mm)           -->
  <g id="PANEL_DINDING_KIRI">
    <!-- Kontur Luar Dinding Kiri -->
    <rect x="4" y="136" width="74" height="44" class="cut-line" />

    <!-- Coakan Port USB Type-C -->
    <rect x="37.5" y="161" width="14" height="9" rx="2" class="cut-line" />
  </g>

  <!-- 6. PANEL DINDING KANAN (74 x 44 mm) di X=82, Y=136 (Polos Bersih)   -->
  <g id="PANEL_DINDING_KANAN">
    <!-- Kontur Luar Dinding Kanan -->
    <rect x="82" y="136" width="74" height="44" class="cut-line" />
  </g>
</svg>
