; ==============================================================================
; PETUNJUK COMMAND TERMINAL PLATFORMIO (CLI):
; ==============================================================================
; 1. Build / Kompilasi Program:
;      pio run                                      -> Kompilasi firmware utama (main.cpp)
;      pio run -e test_loadcell                     -> Kompilasi program uji load cell
;
; 2. Upload / Flash Firmware via USB (Kabel Data):
;      pio run -t upload                            -> Upload firmware utama ke ESP32
;      pio run -e test_loadcell -t upload           -> Upload program uji load cell
;
; 3. Upload / Flash Firmware via OTA (Wireless / Tanpa Kabel):
;      a. Firmware Utama:
;         pio run -t upload --upload-port katrokit-esp32.local
;         (atau ganti dengan IP, misal: --upload-port 192.168.1.50)
;      b. Program Uji Load Cell:
;         pio run -e test_loadcell -t upload --upload-port katrokit-test.local
;         (atau ganti dengan IP, misal: --upload-port 192.168.1.50)
;
; 4. Buka Serial Monitor (115200 baud):
;      pio device monitor                           -> Buka Serial Monitor
;
; 5. Upload & Langsung Buka Serial Monitor (Shortcut USB):
;      pio run -t upload -t monitor                 -> Upload & monitor firmware utama
;      pio run -e test_loadcell -t upload -t monitor -> Upload & monitor test load cell
; ==============================================================================

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    bogde/HX711
    https://github.com/tzapu/WiFiManager.git
    knolleary/PubSubClient
    bblanchon/ArduinoJson

; ------------------------------------------------------------------------------
; Environment 1: Firmware Utama KatroKit v2 (Sistem Lengkap Praktikum Katrol)
; ------------------------------------------------------------------------------
[env:esp32dev]
build_src_filter = +<*> -<test_*.cpp>

; ------------------------------------------------------------------------------
; Environment 2: Program Uji Coba Sensor Load Cell HX711 (Tombol BOOT GPIO 0)
; ------------------------------------------------------------------------------
[env:test_loadcell]
build_src_filter = +<*> -<main.cpp>
